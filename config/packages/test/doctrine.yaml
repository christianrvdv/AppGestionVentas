doctrine:
    dbal:
        url: '%env(DATABASE_URL)%'
        # IMPORTANT: You MUST configure your server version,
        # either here or in config/packages/doctrine.yaml
        # server_version: '16'

    orm:
        auto_mapping: true
        auto_generate_proxy_classes: true
        proxy_dir: '%kernel.cache_dir%/doctrine/orm/Proxies'
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware

        # Ensure sqlite uses foreign keys
        dql:
            string_functions:
                IFNULL: Doctrine\ORM\Query\AST\Functions\IfNull
        filters:
            tenant_filter:
                class: App\Doctrine\Filter\TenantFilter
                enabled: false

# DAMA Doctrine Test Bundle - rollback automático por test
dama_doctrine_test:
    connection: default
    # Each test runs in its own transaction that's rolled back at the end
    # This is much faster than recreating the schema for each test