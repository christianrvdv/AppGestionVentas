security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Identidad GLOBAL por email (ADR-0015; antes era email + tenant
        # slug, ADR-0009). El negocio activo se decide después del login:
        # ver TenantSessionListener y RequireTenantListener.
        app_user_provider:
            id: App\Security\AppUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\AppUserChecker

            form_login:
                login_path: /login
                check_path: /login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: /
                failure_path: /login
                post_only: true

            # Fuerza bruta: 5 intentos fallidos / 15 minutos (por usuario+IP,
            # con techo global). LoginThrottlingListener del SecurityBundle.
            # 15 minutos es el intervalo estándar para endpoints de auth:
            # menos agresivo que 5 para usuarios con problemas de tipeo,
            # suficiente para disuadir fuerza bruta. El bloqueo responde
            # 429 con mensaje genérico (LoginThrottlingResponseListener).
            login_throttling:
                max_attempts: 5
                interval: 15 minutes

            logout:
                path: /logout
                target: /login
                # CSRF ya incluido por defecto (csrf_token_id: logout);
                # se deja explícito junto a los token_ids stateless de csrf.yaml.
                enable_csrf: true

            remember_me:
                lifetime: 2592000 # 30 días
                remember_me_parameter: _remember_me
                path: /
                httponly: true
                secure: auto
                samesite: lax

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Panel de administración global (ADR-0016): exige el rol
        # GLOBAL ROLE_SUPER_ADMIN, no un rol de membresía. A diferencia
        # de ^/ (ROLE_USER), aquí la membresía no alcanza: solo un
        # super_admin pasa.
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
