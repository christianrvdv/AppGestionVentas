security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Carga por email + tenant slug (ADR-0009). El slug se toma del
        # request de login; ver AppUserProvider.
        app_user_provider:
            id: App\Security\AppUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\AppUserChecker

            form_login:
                login_path: /login
                check_path: /login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: /
                failure_path: /login
                post_only: true

            logout:
                path: /logout
                target: /login
                # CSRF ya incluido por defecto (csrf_token_id: logout);
                # se deja explícito junto a los token_ids stateless de csrf.yaml.
                enable_csrf: true

            remember_me:
                lifetime: 2592000 # 30 días
                remember_me_parameter: _remember_me
                path: /
                httponly: true
                secure: auto
                samesite: lax

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
