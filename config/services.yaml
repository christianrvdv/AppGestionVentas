# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Alias explícito para inyección de EntityManagerInterface.
    # DoctrineBundle ya lo registra por defecto, pero lo dejamos
    # explícito por claridad.
    Doctrine\ORM\EntityManagerInterface:
        alias: doctrine.orm.default_entity_manager
        public: false

when@test:
    services:
        # Los _defaults NO se heredan entre bloques de configuración,
        # hay que repetirlos para que sigan aplicando autowiring.
        _defaults:
            autowire: true
            autoconfigure: true

        # Los servicios de dominio todavía no tienen controllers ni
        # comandos que los referencien, así que la fase de optimización
        # del contenedor los elimina (están "sin usar") y los tests de
        # integración no podrían obtenerlos con static::getContainer().
        # En test se marcan públicos para que se conserven.
        #
        # Se limita a App\Service\: hacer público todo el namespace
        # src/ también resucita clases que no son servicios (DTO y
        # Exception, con argumentos escalares que no se pueden
        # autowirear) y rompe la compilación del contenedor.
        App\Service\:
            resource: '../src/Service/'
            exclude:
                # Money es un value object con constructor privado
                # (fǭbricas estǭticas): no es un servicio.
                - '../src/Service/Money/'
            public: true

        # Conteo de queries SQL para tests de regresi�n de N+1 (Fase 7.5).
        # El middleware solo existe en test; los tests lo obtienen con
        # static::getContainer()->get(QueryCounter::class) y cuentan
        # sentencias por substring (p. ej. 'investment_item').
        App\Tests\Support\QueryCounter:
            public: true

        App\Tests\Support\QueryCountingMiddleware:
            tags:
                - { name: doctrine.middleware }
